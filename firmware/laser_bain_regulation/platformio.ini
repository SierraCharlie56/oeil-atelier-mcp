; Régulation bain refroidissement tube laser 110W + interlock sécurité MYJG
; Voir /home/ch/projets/oeil-atelier-mcp/projet_regulation_laser.md pour la conception complète

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Carte 2026-09-05 : ESP32-WROOM-32 DevKit nu (sans écran intégré) + petit
; écran OLED SSD1306 0,96" 128x64 en I2C (voir PIN_OLED_SDA/SCL dans config.h).
; Remplace l'ancienne carte à écran ST7789 SPI intégré (endommagé).
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
